<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <div class="brand-name">News Assistant</div>
        <div class="brand-sub">Reuters financial news · 1987</div>
      </div>
    </div>

    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="section-title">Conversations</div>
    <nav class="threads" id="threads"></nav>

    <div class="sidebar-footer">
      <label class="switch-row" title="bge-reranker re-orders the search results. Off = vector order only, and the 'not found' check is skipped.">
        <span>Reranker</span>
        <input type="checkbox" id="rerank" checked>
        <span class="switch"></span>
      </label>
      <div class="models" id="models">Connecting to the API ...</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="tabs">
        <button class="tab active" data-view="chat">Chat</button>
        <button class="tab" data-view="search">Search lab</button>
      </div>
      <div class="topbar-title" id="topbar-title"></div>
    </header>

    <!-- chat view -->
    <section class="view" id="view-chat">
      <div class="scroller" id="scroller">
        <div class="messages" id="messages"></div>
      </div>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="question" rows="1" dir="auto" placeholder="Ask about the news ..." maxlength="2000"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="composer-hint">Enter to send · Shift+Enter for a new line · Answers come only from the indexed articles</div>
      </form>
    </section>

    <!-- search view -->
    <section class="view hidden" id="view-search">
      <div class="search-page">
        <h2>Search lab</h2>
        <p class="muted">See how the reranker changes the order of the vector-search results.</p>
        <form class="search-form" id="search-form">
          <input id="search-q" dir="auto" placeholder="Why did OPEC cut oil output?" autocomplete="off">
          <label>Results <input type="number" id="search-k" value="5" min="1" max="20"></label>
          <label>Candidates <input type="number" id="search-c" value="30" min="5" max="100"></label>
          <label class="check"><input type="checkbox" id="search-rerank" checked> Rerank</label>
          <button type="submit" class="primary">Search</button>
        </form>
        <div class="muted small" id="search-meta"></div>
        <div class="compare" id="search-results"></div>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
