[project]
name = "news-rag"
version = "0.1.0"
description = "Financial news assistant (RAG) over the Reuters R8 dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.6",
    "openai>=1.50",
    "chromadb>=1.0",
    "docling>=2.0",
    "sentence-transformers>=5.0",
    "torch>=2.7",
    "numpy>=2.0",
    "psutil>=7.2.2",
    "langchain>=1.5.2",
    "langgraph>=1.2.24",
    "langchain-openai>=1.8.5",
    "nemoguardrails>=0.25.0",
    "langfuse>=5.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

# CUDA 12.8 build of PyTorch (the default Windows wheel is CPU only)
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
