# docker compose up -d --build, then open http://localhost:8000

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: news_rag
    ports:
      - "5432:5432"
    volumes:
      - chat_threads:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d news_rag"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: news-rag:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_MAIN_DATABASE: news_rag
    volumes:
      - ./src/assets/database:/app/src/assets/database
      - ./datasets:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/ai/v1/"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped


volumes:
  chat_threads: {}
